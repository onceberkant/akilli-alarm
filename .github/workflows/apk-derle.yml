# GitHub'a her yükleme yapıldığında APK'yı bulutta derler.
# Bilgisayar gerekmez: APK, depodaki "Releases" bölümünden telefona indirilir.
name: APK Derle

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions sekmesinden elle de çalıştırılabilir

permissions:
  contents: write # Release oluşturabilmek için

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle önbelleği (sonraki derlemeleri hızlandırır)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android dosyalarını hazırla
        run: bash tool/hazirla.sh

      # Her derlemede aynı imzayı kullanmak için sabit anahtar.
      # Anahtar yoksa APK her seferinde farklı imzalanır ve telefon güncellemeyi reddeder.
      - name: Sabit imza anahtarını yükle
        env:
          IMZA_ANAHTARI: ${{ secrets.IMZA_ANAHTARI }}
        run: |
          if [ -n "$IMZA_ANAHTARI" ]; then
            mkdir -p ~/.android
            echo "$IMZA_ANAHTARI" | base64 -d > ~/.android/debug.keystore
            echo "Sabit imza anahtarı kullanılıyor"
          else
            echo "::warning::IMZA_ANAHTARI tanımlı değil; APK geçici anahtarla imzalanacak"
          fi

      - name: APK derle
        run: flutter build apk --release

      - name: İmzayı kontrol et
        run: keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | grep -E "Owner|SHA256" | head -3

      - name: APK'yı Actions çıktısı olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: akilli-alarm-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Release oluştur (telefondan kolay indirme)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Alarm v1.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
