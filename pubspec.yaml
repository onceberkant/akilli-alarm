name: akilli_alarm
description: Modern, hafif ve güvenilir Android alarm uygulaması (MVP).
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Türkçe saat seçici ve arayüz metinleri için
  flutter_localizations:
    sdk: flutter
  # Asıl alarm motoru: Android'de exact alarm + ön plan servisi + tam ekran bildirim
  alarm: ^5.15.0
  # Bildirim, exact alarm ve pil optimizasyonu izinlerini istemek için
  permission_handler: ^12.0.0
  # Alarm listesini kalıcı olarak saklamak için (uygulama kapansa da silinmez)
  shared_preferences: ^2.3.0
  # Zil sesi seçerken sesi önizlemek (dinlemek) için
  audioplayers: ^6.8.1
  # Telefondan müzik dosyası seçmek ve yedek dosyası kaydetmek/açmak için
  file_picker: ^13.4.1
  # Seçilen müziği uygulamanın kendi klasörüne kopyalamak için
  path_provider: ^2.1.5
  # "Sallama" uyanma görevi için hareket sensörü
  sensors_plus: ^7.1.1
  # Ana ekran widget'ı için
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Uygulamayla birlikte gelen zil sesleri
  assets:
    - assets/sounds/
